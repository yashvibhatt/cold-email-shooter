version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ces_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ces_user
      POSTGRES_PASSWORD: ces_pass
      POSTGRES_DB: cold_email_shooter
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ces_user -d cold_email_shooter']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ces_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
